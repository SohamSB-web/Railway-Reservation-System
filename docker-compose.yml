version: '3.8'

services:
  rtrs-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rtrs-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
    volumes:
      - rtrs_data:/app/data
      - rtrs_backup:/app/backup_geo_replica
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  rtrs_data:
  rtrs_backup:
